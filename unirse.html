<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050A14">
<title>Unirme a JEV+ · Arca</title>
<link rel="icon" href="/favicon.png">
<style>
:root{--bg:#050A14;--card:#0B1424;--line:#1B2A44;--txt:#EAF2FF;--mut:#8DA0C0;--acc:#39FF88;--blue:#2F7BFF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 80% -10%,rgba(47,123,255,.22),transparent),radial-gradient(700px 420px at -10% 10%,rgba(57,255,136,.14),transparent),var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
main{max-width:460px;margin:0 auto}
.logo{display:block;width:min(220px,60vw);height:auto;margin:18px 0 6px}
h1{font-size:1.35rem;margin:18px 0 4px}
p.lead{color:var(--mut);margin:0 0 18px}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:.92rem}
label small{font-weight:400;color:var(--mut)}
input,textarea{width:100%;background:#07101F;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px;font:inherit}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
textarea{min-height:84px;resize:vertical}
button{border:0;border-radius:12px;padding:14px;font:700 1rem/1 inherit;color:#031109;background:linear-gradient(90deg,var(--acc),#7CFFB6);cursor:pointer}
button:disabled{opacity:.6}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
#msg{min-height:1.3em;font-size:.92rem;color:#FFB4B4}
.ok{background:var(--card);border:1px solid var(--acc);border-radius:16px;padding:22px;text-align:center}
.ok h2{margin:0 0 8px;color:var(--acc)}
a{color:#6FA3FF}
</style>
</head>
<body>
<main>
  <img class="logo" src="/img/jev-logo.webp" alt="JEV+ Olocuilta" width="756" height="362">
  <div id="box">
    <h1>Quiero unirme</h1>
    <p class="lead">Llena esto (2 minutos). Cuando los líderes lo aprueben, te mandan tu acceso a Arca por WhatsApp.</p>
    <form id="f" novalidate>
      <label>Nombre completo<input name="name" required autocomplete="name" maxlength="80"></label>
      <label>Correo <small>(con este vas a entrar a Arca)</small><input name="email" type="email" required autocomplete="email" inputmode="email" maxlength="254"></label>
      <label>WhatsApp<input name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="30" placeholder="7000 0000"></label>
      <label>Fecha de cumpleaños<input name="birth" type="date"></label>
      <label>¿Quién te invitó? <small>(opcional)</small><input name="invitedBy" maxlength="80"></label>
      <label>Algo que quieras contarnos <small>(opcional)</small><textarea name="notes" maxlength="400"></textarea></label>
      <div class="hp" aria-hidden="true"><label>Sitio web<input name="website" tabindex="-1" autocomplete="off"></label></div>
      <div id="msg" role="status" aria-live="polite"></div>
      <button type="submit">Enviar solicitud</button>
    </form>
    <p class="lead" style="margin-top:14px">¿Ya tienes cuenta? <a href="/">Entrar a Arca</a></p>
  </div>
</main>
<script>
const f=document.getElementById('f'),msg=document.getElementById('msg');
f.addEventListener('submit',async e=>{
  e.preventDefault();msg.textContent='';
  const d=Object.fromEntries(new FormData(f));
  if(!d.name||d.name.trim().length<3){msg.textContent='Escribe tu nombre completo.';return}
  if(!/^\S+@\S+\.\S+$/.test(d.email||'')){msg.textContent='Escribe un correo válido.';return}
  const b=f.querySelector('button');b.disabled=true;b.textContent='Enviando…';
  try{
    const r=await fetch('/api/join/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.message||'No se pudo enviar.');
    document.getElementById('box').innerHTML='<div class="ok"><h2>¡Listo!</h2><p>Recibimos tu solicitud. Un líder la va a revisar y te escribe por WhatsApp con tu acceso. ¡Dios te bendiga!</p></div>';
  }catch(err){msg.textContent=err.message;b.disabled=false;b.textContent='Enviar solicitud'}
});
</script>
</body>
</html>
